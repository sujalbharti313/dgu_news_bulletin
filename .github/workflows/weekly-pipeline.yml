# AI//CAMPUS server-side scheduler (free): GitHub Actions on this public repository.
#
# Daily at 06:00 Asia/Kolkata it first runs the Stage 3.5 edition scheduler (while the free Gemini quota is unused),
# then collects news (Stage 3.1), processes it (3.2), analyses new stories (3.3) and ranks the running week
# incrementally (3.4). The edition scheduler is
# idempotent: it only generates the edition of a week that has ended and has none yet (Monday after the week;
# missed or failed runs are retried on the next run), so running daily is safe. A second Monday run at 15:00 IST
# retries only the edition step. Nothing here approves or publishes: an admin does that in the admin pages.
#
# Last, the Stage 3.6 cleanup pass removes unselected working data of weeks whose edition was confirmed published
# (after the safety delay, minimum story age and manifest hold in backend/config/retention.toml). It uses no AI and
# no quota, is idempotent, and never deletes published editions, snapshots, stories, links or audit logs. A run
# that is missed or late simply catches up the next day: every deadline is a stored timestamp, not a cron time.
#
# Needs repository secrets (Settings -> Secrets and variables -> Actions): DATABASE_URL (Supabase session pooler
# URI), GEMINI_API_KEY (free AI Studio key) and optionally GMAIL_CLIENT_ID / GMAIL_CLIENT_SECRET /
# GMAIL_REFRESH_TOKEN. Secrets are masked in logs, and the scripts never print them. This repository is public,
# so run logs are public too: they contain only counts, statuses and public news headlines.
#
# GitHub may delay scheduled runs, and disables schedules after 60 days without repository activity (it emails a
# warning; re-enable under Actions). Times in `cron` are UTC; the bulletin's week and due time are decided in
# Python from backend/config/edition.toml (Asia/Kolkata), not from these cron lines.
name: AI//CAMPUS pipeline

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST every day: full pipeline
    - cron: "30 9 * * 1" # 15:00 IST Monday: edition retry only
  workflow_dispatch:
    inputs:
      steps:
        description: "Which steps to run"
        type: choice
        options: [all, edition, cleanup]
        default: all

permissions:
  contents: read

concurrency:
  group: ai-campus-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      DB_USE_NULL_POOL: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      # Per-run caps sized for ~50 new stories a day within the free Gemini quota (~200 requests/day).
      AI_MAX_STORIES_PER_RUN: "50"
      RANKING_MAX_EVALUATIONS_PER_RUN: "50"
      ONLY_EDITION: ${{ github.event.schedule == '30 9 * * 1' || inputs.steps == 'edition' }}
      ONLY_CLEANUP: ${{ inputs.steps == 'cleanup' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt

      - name: Check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::The DATABASE_URL secret is not set; nothing to do. See backend/README.md (Stage 3.5)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m scripts.edition check

      # The edition runs first, while the day's free Gemini quota is untouched: composing it needs only a few
      # requests, but the daily analysis and ranking below can use up the rest of the quota.
      - name: "Stage 3.5: weekly edition"
        if: steps.config.outputs.skip != 'true' && env.ONLY_CLEANUP != 'true'
        run: |
          # A failed edition must not stop the daily news pipeline below; the Report step fails the run instead.
          set +e; python -m scripts.edition scheduled; code=$?; set -e
          if [ "$code" -ne 0 ]; then echo "::error::Weekly edition generation failed (exit $code)."; fi
          echo "edition_code=$code" >> "$GITHUB_ENV"

      - name: "Stage 3.1-3.4: collect, process, analyse, rank this week"
        if: steps.config.outputs.skip != 'true' && env.ONLY_EDITION != 'true' && env.ONLY_CLEANUP != 'true'
        run: |
          problems=0
          step() {  # exit 0 = ok, 1 = partial (warning, e.g. one feed failed or stories still pending), 2+ = error
            name="$1"; shift
            set +e; "$@"; code=$?; set -e
            if [ "$code" -eq 1 ]; then echo "::warning::$name finished partially (exit 1); see the log above."; fi
            if [ "$code" -ge 2 ]; then echo "::error::$name failed (exit $code)."; problems=1; fi
          }
          step "Ingestion" python -m scripts.ingest run
          step "Processing" python -m scripts.process run
          step "AI analysis" python -m scripts.intelligence run
          step "Ranking (current week)" python -m scripts.rank run --week current
          echo "problems=$problems" >> "$GITHUB_ENV"

      # Last, so it never delays the news pipeline and never overlaps it (deletion also waits by itself while a
      # pipeline stage is running). Exit 2 = not set up yet (migration 0008 not applied) or invalid retention
      # config: nothing is deleted, so it is a warning, not a failed run.
      - name: "Stage 3.6: cleanup and data retention"
        if: steps.config.outputs.skip != 'true' && env.ONLY_EDITION != 'true'
        run: |
          set +e; python -m scripts.cleanup scheduled; code=$?; set -e
          if [ "$code" -eq 2 ]; then echo "::warning::Cleanup skipped: not set up or invalid configuration (see above)."; code=0; fi
          if [ "$code" -ne 0 ]; then echo "::error::A cleanup job failed (exit $code); it is retried automatically."; fi
          echo "cleanup_code=$code" >> "$GITHUB_ENV"

      - name: Report
        if: always() && steps.config.outputs.skip != 'true'
        run: |
          python -m scripts.edition status --limit 5 || true
          python -m scripts.cleanup status --limit 5 || true
          if [ "${problems:-0}" != "0" ] || [ "${edition_code:-0}" != "0" ] || [ "${cleanup_code:-0}" != "0" ]; then
            echo "::error::A pipeline stage failed (see above)."; exit 1
          fi
