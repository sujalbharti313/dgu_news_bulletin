# AI//CAMPUS live checks (Stage 4.3): proves the hosted system works end to end, from GitHub's servers, with the same
# repository secrets as the daily pipeline. Safe to run at any time:
# - database writes go only into a temporary table that is rolled back; real rows are only read;
# - Gemini: 1 tiny generation + 1 embedding call (3 short texts) per run, a negligible part of the free daily quota;
# - Gmail: read-only scope, lists 1 message id and reads only its From header;
# - website/API: GET/OPTIONS requests, plus admin requests WITHOUT a valid sign-in (they must be refused).
# Nothing is published, approved, generated or cleaned up. Logs show PASS/FAIL lines only, never secrets.
#
# Set the two public URLs once under Settings -> Secrets and variables -> Actions -> Variables:
#   SITE_URL = https://<frontend>.vercel.app     API_URL = https://<backend>.vercel.app
# Run it by hand (Actions -> AI//CAMPUS live checks -> Run workflow); it also runs every Monday at 12:00 IST, after
# the weekly edition is due, so a broken website, API, Gemini key or Gmail token turns a run red (GitHub emails you).
name: AI//CAMPUS live checks

on:
  schedule:
    - cron: "30 6 * * 1" # 12:00 IST Monday
  workflow_dispatch:
    inputs:
      checks:
        description: "Which checks to run"
        type: choice
        options: [all, db, gemini, embedding, gmail, api, site]
        default: all

permissions:
  contents: read

concurrency:
  group: ai-campus-live-checks
  cancel-in-progress: false

jobs:
  live-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      DB_USE_NULL_POOL: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Live checks
        run: |
          if [ -z "$API_URL" ] || [ -z "$SITE_URL" ]; then
            echo "::warning::Repository variables API_URL and/or SITE_URL are not set; website and API checks are skipped."
          fi
          python -m scripts.live_check ${{ inputs.checks || 'all' }} ${API_URL:+--api-url "$API_URL"} ${SITE_URL:+--site-url "$SITE_URL"}
