[[sources]]
key = "tldr-ai"
type = "gmail"
name = "TLDR AI"
category = "newsletter"
# Gmail search syntax. Keep it narrow; allowed_senders is checked again on every message.
query = 'from:dan@tldrnewsletter.com subject:"TLDR AI"'
allowed_senders = ["dan@tldrnewsletter.com"]
parser = "tldr"
max_messages = 10
initial_lookback_days = 7
notes = "Skipped automatically until GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET and GMAIL_REFRESH_TOKEN are set. Confirm the sender address against a real issue in the mailbox."
