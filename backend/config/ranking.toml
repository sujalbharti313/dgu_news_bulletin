# Stage 3.4 verification and editorial ranking configuration.
#
# Every number the ranking engine uses lives here, so changes are reviewed in git rather than buried in code.
# `version` is stored with every verification and ranking run: bump it whenever you change anything below, so
# results computed under different rules are never mixed up. The file is validated strictly at start-up
# (weights must sum to 1, thresholds must be ordered, unknown keys are rejected).

version = "3.4.1"

# --- Final editorial score -------------------------------------------------------------------------------
# Final score = sum(dimension score x weight). Every dimension is 0-100, so the final score is 0-100.
# A dimension that cannot be assessed (for example timeliness with no known date) contributes 0 and is listed
# in `unavailable_dimensions`; nothing is guessed.
[weights]
global_impact = 0.20
technical_significance = 0.20
student_relevance = 0.20
evidence_quality = 0.15
source_credibility = 0.15
timeliness = 0.10

# Lower bound (inclusive) of each priority class. Scores below the last bound are "Very Low".
[classification]
exceptional = 85
high = 70
medium = 55
low = 40

# --- Timeliness (Asia/Kolkata, Monday 00:00 to Sunday 23:59:59) --------------------------------------------
[timeliness]
timezone = "Asia/Kolkata"
# Published inside the edition week: 100 on the last day, minus this per day before the end of the week.
in_window_daily_decay = 2
# Published up to `late_arrival_days` before the week started (a story that broke just before Monday).
late_arrival_days = 3
late_arrival_score = 70
# Older than that: still shown to the admin, with a low score and an out-of-window flag.
stale_days = 14
stale_score = 35
very_stale_days = 30
very_stale_score = 10
# Only a newsletter date is known (the date a newsletter mentioned the article, not its publication date).
newsletter_date_cap = 80

# --- Verification thresholds -----------------------------------------------------------------------------
[verification]
# Source text shorter than this (distinct words) is too thin to judge technical substance: marked unknown.
min_words_for_substance = 25
# A stated claim whose content words are less than this share present in its cited sources is weakly supported.
claim_support_threshold = 0.5
# Same, for the Stage 3.3 headline against all source text.
headline_support_threshold = 0.4
# A report adding less than this share of new content words to the official announcement is a repeat of it.
repeat_novelty_threshold = 0.35
# Stage 3.3 preliminary scores at or above this, with weak evidence, are flagged as exceeding the evidence.
preliminary_overreach_score = 70
preliminary_overreach_evidence = 45

# Source credibility score for each credibility level (see config/source_registry.toml).
[credibility]
primary = 85
established = 75
provisional = 55
aggregator = 45
unknown = 40
low = 15
# Added for each further independent publisher (corroboration), at most `max_corroboration_bonus`.
corroboration_bonus = 5
max_corroboration_bonus = 10
# A newsletter summary linking to a registry-known site scores at most the site's score minus this.
newsletter_penalty = 10

# --- Quality gates ---------------------------------------------------------------------------------------
# action: "review_required" keeps a story out of the automatic shortlist until an admin looks at it;
# "ineligible" keeps it out of this edition. Nothing is ever deleted.
[gates.missing_source]
enabled = true
action = "review_required"

[gates.insufficient_evidence]
enabled = true
action = "review_required"
min_evidence_quality = 35
# Below this the story is ineligible rather than review_required.
ineligible_below = 20

[gates.severe_inconsistency]
enabled = true
action = "review_required"
min_claim_consistency = 40

[gates.duplicate_event]
enabled = true
action = "ineligible"
# Two clusters are the same event when they share an arXiv id / DOI, or a product name within this many days,
# or have very similar headlines about the same organisation within `title_window_days`.
product_window_days = 7
title_window_days = 4
title_similarity = 0.5

[gates.out_of_window]
enabled = true
# Published before the week (beyond late_arrival_days) or after it.
action = "ineligible"

[gates.unverified_major_claim]
enabled = true
action = "review_required"
# A "major" claim: Stage 3.3 global impact at or above this, or a superiority / benchmark hype signal.
major_impact_score = 70
# ... that is not adequately evidenced: evidence quality below this and no independent corroboration. Not applied
# when the single account is a primary source or a registry-reviewed publication (scoring caps apply instead).
min_evidence_quality = 60

[gates.unknown_single_source]
enabled = true
action = "review_required"

[gates.analysis_needs_review]
# Stage 3.3 marked the analysis needs_review (flagged source content, instruction-like text).
enabled = true
action = "review_required"

# --- AI claim check (Gemini, optional, see RANKING_AI_CHECK) -------------------------------------------------
[ai_check]
# Only stories whose rules-only score reaches this are checked; they are the plausible shortlist candidates.
min_score = 50

# --- Diversity-aware shortlist ---------------------------------------------------------------------------
[shortlist]
target = 10
# Stories below this final score are never shortlisted, even when the shortlist is not full.
min_score = 55
max_per_category = 3
max_per_organisation = 2
# Stories at or above this score are kept even when their category or organisation cap is reached.
exceptional_score = 85
# An unrepresented coverage group may replace the lowest non-exceptional pick when within this many points.
coverage_swap_margin = 8

# Coverage groups the shortlist tries to represent (by Stage 3.3 primary or secondary category key).
[shortlist.coverage_groups]
research = ["ai-research"]
model_releases = ["ai-model-releases"]
industry = ["industry-business"]
tools = ["ai-tools-development"]
india = ["india-ai"]
robotics_hardware = ["robotics-automation", "ai-infrastructure-hardware"]
safety_governance = ["ai-safety-governance"]
education_careers = ["ai-education-careers"]
