# Stage 3.3 story categories. The AI may choose only these keys; labels are what readers see.
# Changing this file changes the engine key, so stories are re-analysed on the next run.
# `topic` maps a category to the frontend's topic filter (src/lib/types.ts); omit it when none fits.

max_secondary = 2

[[categories]]
key = "ai-research"
label = "AI Research"
description = "New research findings, papers, preprints, methods, datasets and benchmark studies from labs or universities."
topic = "research"

[[categories]]
key = "ai-model-releases"
label = "AI Model Releases"
description = "A new or updated AI model is released, opened up or made available (weights, API or product)."
topic = "models"

[[categories]]
key = "ai-tools-development"
label = "AI Tools and Development"
description = "Developer tools, frameworks, libraries, SDKs, APIs, agents and open-source software for building with AI."
topic = "tools"

[[categories]]
