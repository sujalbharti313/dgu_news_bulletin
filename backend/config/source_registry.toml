# Stage 3.4 source registry: what kind of source a site is, as reviewed by a person.
#
# This is deliberately NOT a reputation list. An entry records a fact about the source (it is a research
# repository, or the organisation's own channel, or a newsletter that summarises other outlets) and the date a
# person checked that fact. It never says an individual article is true.
#
# How a source is assessed (see app/ranking/credibility.py):
#   1. An entry below matching the article's site (domain suffix) or its ingestion source key, with a
#      `reviewed_on` date, decides the level.
#   2. Otherwise the Stage 3.1 source category decides a PROVISIONAL level (the source was configured for
#      ingestion, but nobody has reviewed it here).
#   3. Otherwise the source is UNKNOWN. Unknown is not the same as unreliable: it only means nobody has
#      evaluated it, and the story needs corroboration or a human look before it is shortlisted.
#
# Levels: primary (the organisation's own channel, a government, or a research repository: the original source
# for its own announcements or papers, which does not make self-reported claims independent), established (a
# news or technical publication a person has reviewed), aggregator (newsletters and digests that summarise
# other outlets), low (a person reviewed it and found it mostly promotional or unreliable).
# Kinds: official_channel, research_repository, government, news_outlet, technical_publication, newsletter,
# press_release_wire, community.
#
# To add a news outlet after reviewing it:
#   [[sources]]
#   domain = "example-news.com"
#   kind = "news_outlet"
#   level = "established"
#   reviewed_on = "2026-11-19"
#   notes = "Why: original reporting, named authors, corrections policy."

version = "1"

[[sources]]
domain = "arxiv.org"
source_key = "arxiv-cs-ai"
kind = "research_repository"
level = "primary"
reviewed_on = "2026-11-19"
notes = "Preprint repository: the primary source for the papers it hosts. Preprints are not peer reviewed."

[[sources]]
domain = "openai.com"
source_key = "openai-news"
kind = "official_channel"
level = "primary"
organisation = "OpenAI"
reviewed_on = "2026-11-19"
notes = "OpenAI's own news channel: primary source for its announcements; claims about its own products are self-reported."

[[sources]]
domain = "huggingface.co"
source_key = "huggingface-blog"
kind = "official_channel"
level = "primary"
organisation = "Hugging Face"
reviewed_on = "2026-11-19"
notes = "Hugging Face's own blog. Some posts are written by community members or partners."

[[sources]]
domain = "research.google"
