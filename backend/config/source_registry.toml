kind = "official_channel"
level = "primary"
organisation = "Google Research"
reviewed_on = "2026-11-19"
notes = "Google Research's own blog: primary source for its research announcements."

[[sources]]
source_key = "tldr-ai"
kind = "newsletter"
level = "aggregator"
reviewed_on = "2026-11-19"
notes = "Newsletter that summarises and links to other outlets; not original reporting."

